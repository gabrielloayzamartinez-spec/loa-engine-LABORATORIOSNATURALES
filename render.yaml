services:
  - type: web
    name: ghl-pipeline-maestro-tool
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: LOA_LICENSE_KEY
        sync: false
      - key: STRICT_CONFIG
        value: "false"
      - key: PREFLIGHT_MAX_MS
        value: "5000"
      - key: PAUSE_BENAVIDES
        value: "false"
      # Embudo de Oportunidades desactivado (no se usa en la operación actual).
      - key: OPPORTUNITY_SYNC_ENABLED
        value: "false"

      # GHL Multi-Sede (arquitectura descentralizada point-to-point)
      # IMPORTANTE: la Cuenta Empresa NO es el "GHL Central" hub deprecado.
      # Es una replica de SOLO ANALITICA: recibe copia de los datos para
      # medicion macro, sin chats, sin ruteo y sin asignacion de asesores.
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GHL_API_KEY_PALACIOS
        sync: false
      - key: GHL_LOCATION_ID_PALACIOS
        sync: false
      - key: GHL_API_KEY_BENAVIDES
        sync: false
      - key: GHL_LOCATION_ID_BENAVIDES
        sync: false
      - key: GHL_API_KEY_ROOSEVELT
        sync: false
      - key: GHL_LOCATION_ID_ROOSEVELT
        sync: false
      - key: GHL_API_KEY_PIURA
        sync: false
      - key: GHL_LOCATION_ID_PIURA
        sync: false

      # Colas durables y estado distribuido (feature flag)
      - key: QUEUE_DRIVER
        value: memory
      - key: REDIS_URL
        sync: false
      - key: PERSISTENCE_DRIVER
        value: file
      - key: DATABASE_URL
        sync: false

      # ── NIVELES: operación por día ─────────────────────────────────────────
      # N1 trabaja SOLO el día de hoy; N2 el histórico hasta ayer.
      - key: N2_HASTA_AYER
        value: "true"
      # Espejo: se publica el estado ACTUAL de vTiger (incluye correcciones).
      - key: GHL_MODO_ESPEJO
        value: "true"
      # Radar: red de seguridad, no el mecanismo principal (el webhook manda).
      - key: RADAR_ENABLED
        value: "true"
      - key: RADAR_INTERVALO_MS
        value: "60000"
      - key: TRABAJO_DIA_MS
        value: "900000"
      # Nivel 3 (reactivo por cambio en vTiger)
      - key: NIVEL3_LOTE
        value: "10"
      - key: NIVEL3_MAX_DIA
        value: "20000"
      - key: NIVEL3_MAX_ATRASO_MIN
        value: "45"
      - key: NIVEL3_SOLO_COMPRADORES
        value: "false"
      - key: NIVEL3_COOLDOWN_MIN
        value: "10"
      # Las ventas de HOY las publica el N2 al día siguiente.
      - key: ORDER_HISTORY_SOLO_COMPRADORES
        value: "true"
      # Cuenta Empresa (réplica analítica): pausada mientras se opera por sede.
      - key: PAUSE_CUENTA_EMPRESA
        value: "true"

      # vTiger CRM Connection
      - key: VTIGER_URL
        value: https://ventascallcenter.com
      - key: VTIGER_USERNAME
        value: GABRIEL
      - key: VTIGER_ACCESS_KEY
        sync: false

      # Meta Configuración General
      - key: META_API_VERSION
        value: v20.0
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_BACKUP_TOKENS
        sync: false

      # Meta App - Palacios
      - key: META_APP_ID_PALACIOS
        sync: false
      - key: META_APP_SECRET_PALACIOS
        sync: false
      - key: META_ACCESS_TOKEN_PALACIOS
        sync: false
      - key: META_AD_ACCOUNT_IDS_PALACIOS
        sync: false

      # Meta App - Benavides
      - key: META_APP_ID_BENAVIDES
        sync: false
      - key: META_APP_SECRET_BENAVIDES
        sync: false
      - key: META_ACCESS_TOKEN_BENAVIDES
        sync: false
      - key: META_AD_ACCOUNT_IDS_BENAVIDES
        sync: false

      # Meta App - Roosevelt
      - key: META_APP_ID_ROOSEVELT
        sync: false
      - key: META_APP_SECRET_ROOSEVELT
        sync: false
      - key: META_ACCESS_TOKEN_ROOSEVELT
        sync: false
      - key: META_AD_ACCOUNT_IDS_ROOSEVELT
        sync: false

      # Meta App - Piura
      - key: META_APP_ID_PIURA
        sync: false
      - key: META_APP_SECRET_PIURA
        sync: false
      - key: META_ACCESS_TOKEN_PIURA
        sync: false
      - key: META_AD_ACCOUNT_IDS_PIURA
        sync: false
