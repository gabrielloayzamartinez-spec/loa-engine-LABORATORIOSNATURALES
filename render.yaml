services:
  - type: web
    name: ghl-pipeline-maestro-tool
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
